plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

fabricApi {
	// Client game tests live in src/gametest and are not part of the mod jar.
	// Run them with: ./gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "screenshot-toolkit-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// Minecraft 26.x is no longer obfuscated, so no mappings are needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional integration. Only compiled against; not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Mod Menu in the dev client, so the config screen can be tested with runClient
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Sodium and Iris in the dev client, to check compatibility: ./gradlew runClient -PwithIris
	if (project.hasProperty("withIris")) {
		localRuntime "maven.modrinth:iris:${project.iris_version}"
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}

	// Plain unit tests for the adaptive loop (src/test), which has no Minecraft dependencies.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// Minecraft 26.x requires Java 25. Gradle will download it if it isn't installed.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def archivesName = project.base.archivesName.get()
	inputs.property "archivesName", archivesName

	from("LICENSE") {
		rename { "${it}_${archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
